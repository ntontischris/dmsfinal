# Δεδομένα επίδειξης στη ζωντανή βάση: γέμισμα (demo_seed) ή σβήσιμο (demo_purge). Μόνο με το χέρι, μόνο από το main.
# Τα δεδομένα και οι κανόνες τους ζουν στο migration 20261019120000_demo_data.sql· εδώ μόνο η κλήση και μια σύνοψη.
name: demo-data

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'seed = γέμισμα · purge = σβήσιμο · purge_attached = σβήσιμο μαζί με όσα μπήκαν σε δεδομένα επίδειξης'
        required: true
        type: choice
        options: [seed, purge, purge_attached]

# Ποτέ δύο μαζί: το δεύτερο περιμένει.
concurrency:
  group: demo-data
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  run:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Σύνδεση με τη βάση
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Λείπουν τα secrets της βάσης."
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Γέμισμα ή σβήσιμο
        run: |
          case "$ACTION" in
            seed) sql="select public.demo_seed() as result" ;;
            purge) sql="select public.demo_purge(false) as result" ;;
            purge_attached) sql="select public.demo_purge(true) as result" ;;
            *) echo "Άγνωστη ενέργεια: $ACTION"; exit 1 ;;
          esac
          supabase db query --linked "$sql"
      - name: Σύνοψη (γραμμές επίδειξης ανά πίνακα)
        run: |
          supabase db query --linked \
            "select table_name, count(*) as rows from public.demo_rows group by table_name order by table_name"
