# Αυτόματοι έλεγχοι της εφαρμογής (ADR 0018): πρέπει να είναι πράσινοι πριν από κάθε merge.
name: app

on:
  # Draft PR: μόνο οι γρήγοροι έλεγχοι (κώδικας, βάση), για γρήγορη απάντηση στις διορθώσεις.
  # Το e2e τρέχει όταν το PR είναι έτοιμο (ready_for_review) και σε κάθε push μετά από αυτό.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Κάθε νύχτα στο main: πιάνει τεστ που χαλάνε από την ημερομηνία πριν τα συναντήσει κάποιο PR.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Νέο push στο ίδιο PR ακυρώνει το παλιό τρέξιμο· στο main κάθε τρέξιμο ολοκληρώνεται.
concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Κανένα κλειδί, όρια modules, χρώματα μόνο από tokens
        run: pnpm check
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Η βάση: migrations και τεστ κανόνων πρόσβασης (pgTAP) σε προσωρινή τοπική βάση, σε κάθε PR.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase db start
      - name: Τεστ βάσης (pgTAP)
        run: supabase test db
      - name: Έλεγχος των migrations
        run: supabase db lint --level error

  # Από άκρη σε άκρη: τοπικό Supabase (βάση + είσοδος), φανταστικοί Χρήστες, η εφαρμογή σε production build, browser.
  # Μοιρασμένο σε 4 μηχανήματα, το καθένα με δική του βάση και δικούς του φανταστικούς Χρήστες.
  e2e:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Τοπική τιμή για το CI, όχι μυστικό: το σκούντημα της ουράς email την χρειάζεται στα τεστ.
      CRON_SECRET: e2e-cron-secret
      # Τοπική τιμή για το CI, όχι μυστικό: υπογράφει το δοκιμαστικό αίτημα του Send Email Hook.
      SEND_EMAIL_HOOK_SECRET: 'v1,whsec_ZTJlLWhvb2stc2VjcmV0LW5vdC1hLWtleQ=='
      # Ψεύτικοι πάροχοι για τη N5 (#209): οι συνδέσεις μετρούν ως στημένες και το «Έλεγχος τώρα» δεν κάνει κλήση δικτύου.
      INTEGRATIONS_FAKE_PROVIDERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Το storage-api μένει ενεργό: τα PDF των Τιμολογίων (#152) ανεβαίνουν σε ιδιωτικό bucket.
      - name: Τοπικό Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - name: Στοιχεία σύνδεσης του τοπικού Supabase (δημόσιες προεπιλογές, όχι μυστικά)
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Φανταστικοί Χρήστες
        run: node e2e/seed.mjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Τεστ από άκρη σε άκρη
        run: pnpm e2e --shard=${{ matrix.shard }}/4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.shard }}
          path: |
            app/e2e-results
            app/e2e-report
          retention-days: 7

  # Στο main: τα migrations περνούν στη βάση ανάπτυξης. Τρέχει μόνο όταν υπάρχουν τα secrets του repo.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, database, e2e]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Migrations στη βάση ανάπτυξης
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Λείπουν τα secrets της βάσης· τα migrations δεν περνούν ακόμα."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # --include-all: με παράλληλα PR η σειρά merge δεν ταιριάζει πάντα με τις χρονοσημάνσεις των migrations.
          supabase db push --include-all
