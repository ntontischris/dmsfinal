<title>Φίλτρα χωρίς χάπια</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: η οθόνη Πελάτες (Χώροι, σκούρα) με φαρδύ πίνακα· τα φίλτρα δεν τρώνε πια πλάτος. Κάτω σταθερός διακόπτης. */
:root{
  --bg:#0a1020; --panel:#101a2f; --panel-2:#16223b; --line:#24324f; --fg:#e8edf7; --muted:#8d9ab5;
  --on:#f4f6fb; --on-fg:#0a1020; --accent:#ff4a3d; --focus:#9fb4ff; --link:#aab9ff; --cand:#e8c26a; --act:#4fd1a1; --off:#8d9ab5;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 120px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.proto{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.proto b{color:var(--fg)}
.screens{display:flex;gap:6px;flex-wrap:wrap}
.screens button{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--muted)}
.screens button[aria-pressed=true]{background:var(--panel-2);color:var(--fg);border-color:var(--focus)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.crumb{color:var(--muted);font-size:13px}
h1{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1}
h1 i{color:var(--accent);font-style:normal}
.cta{background:var(--focus);color:var(--on-fg);border:0;border-radius:999px;padding:9px 18px;font-weight:600}
.why{color:var(--muted);font-size:14px;max-width:75ch;margin:0}
.state{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.state b{color:var(--act);font-weight:500}

/* εργαλειοθήκη */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative}
.search{flex:1 1 260px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.search:focus{border-color:var(--focus);outline:none}
/* κάρτα-φίλτρο (το ύφος «Μαλακές κάρτες») */
.fc{position:relative}
.fc-btn{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.fc-btn[aria-expanded=true]{border-color:color-mix(in srgb,var(--focus) 55%,var(--line))}
.chip{font-size:12.5px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis}
.chip.set{background:var(--on);color:var(--on-fg);font-weight:600}
.chev{color:var(--muted);font-size:12px}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:min(300px,calc(100vw - 32px));background:var(--panel-2);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:8px;display:flex;flex-direction:column;gap:6px}
.pop.right{left:auto;right:0}
.p-search{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.list{display:flex;flex-direction:column;max-height:300px;overflow:auto}
.opt{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;cursor:pointer;padding:7px 8px;color:var(--muted);border-radius:8px;font-weight:500;text-transform:none;letter-spacing:0;font-size:14px}
.opt:hover{background:var(--line);color:var(--fg)}
.opt[aria-pressed=true]{color:var(--fg);font-weight:600}
.rd{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);flex:none;box-sizing:border-box}
.opt[aria-pressed=true] .rd{border:4px solid var(--focus)}
.o-l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o-c{font-family:var(--mono);font-size:11.5px;opacity:.6}
.link{background:none;border:0;color:var(--link);cursor:pointer;padding:4px 2px;font-size:14px}
.tok{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 11px;font-size:13.5px;white-space:nowrap}
.tok small{color:var(--muted)}
.tok button{background:none;border:0;cursor:pointer;color:var(--muted);width:22px;height:22px;border-radius:50%;line-height:1}
.toks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fbtn{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600}
.badge{background:var(--on);color:var(--on-fg);border-radius:999px;font-size:12px;padding:0 7px;font-weight:700}
/* συρτάρι */
.scrim{position:fixed;inset:0;background:rgba(3,6,14,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(360px,100vw);box-sizing:border-box;background:var(--bg);border-left:1px solid var(--line);
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.drawer h2{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.acc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.acc.open{border-color:color-mix(in srgb,var(--focus) 45%,var(--line))}
.acc-h{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;background:none;border:0;cursor:pointer;text-align:left;padding:12px 0;font-weight:600}
.acc-b{padding:0 0 12px;display:flex;flex-direction:column;gap:6px}
/* πίνακας */
.results{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-width:0}
.tbl{overflow-x:auto;border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap;position:relative}
td{padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.who{display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who a{color:var(--link);font-weight:600;text-decoration:none}
.who small{display:block;color:var(--muted);font-size:12.5px}
.st{font-size:12.5px;padding:2px 10px;border-radius:999px;font-weight:600}
.st-Υποψήφιος{background:color-mix(in srgb,var(--cand) 18%,transparent);color:var(--cand)}
.st-Ενεργός{background:color-mix(in srgb,var(--act) 16%,transparent);color:var(--act)}
.st-Ανενεργός{background:var(--panel-2);color:var(--off)}
.mgr{display:flex;align-items:center;gap:8px}
.mgr span{width:24px;height:24px;border-radius:50%;background:var(--focus);color:var(--on-fg);display:grid;place-items:center;font-size:11px;font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted)}
.more{padding:10px 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
/* φίλτρο στην επικεφαλίδα */
.th-btn{background:none;border:0;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;align-items:center;gap:6px;padding:4px 6px;margin:-4px -6px;border-radius:6px}
.th-btn:hover{background:var(--panel-2);color:var(--fg)}
.th-btn.set{color:var(--focus)}
.th-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
/* διακόπτης */
.switch{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:6px;background:#fff;color:#0a1020;border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.switch button{border:0;background:#e9ecf3;color:#0a1020;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;flex:none}
.switch span{padding:0 10px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="proto">
    <div><b>Πρωτότυπο, δεν είναι η εφαρμογή.</b> Γύρος 4: η στήλη στο πλάι στενεύει τον πίνακα Πελατών. Εδώ είναι τρεις τρόποι να μείνουν οι «Μαλακές κάρτες» χωρίς να τρώνε πλάτος. Όλα δουλεύουν με κλικ, τα δεδομένα είναι ψεύτικα.</div>
    <div>Άλλαξε παραλλαγή με τη λευκή μπάρα κάτω ή με τα ← →. Δοκίμασέ τη και σε άλλη οθόνη:</div>
    <div class="screens" id="screens"></div>
  </div>
  <div class="head">
    <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
    <button class="cta" id="cta"></button>
  </div>
  <p class="why" id="why"></p>
  <div id="ui"></div>
  <div class="state" id="state"></div>
</div>

<div class="switch" role="group" aria-label="Παραλλαγή">
  <button id="prev" aria-label="Προηγούμενη παραλλαγή">←</button>
  <span id="vlabel"></span>
  <button id="next" aria-label="Επόμενη παραλλαγή">→</button>
</div>

<script>
const VARIANTS=[
  {key:"row",name:"1 — Κάρτες σε μία σειρά πάνω",why:"Οι κάρτες μπαίνουν σε μία σειρά δίπλα στην αναζήτηση, και ο πίνακας κρατά όλο το πλάτος. Πατάς μια κάρτα και η λίστα της ανοίγει από κάτω σαν μικρό παράθυρο. Η κάρτα δείχνει πάντα τι έχεις διαλέξει."},
  {key:"drawer",name:"2 — Κουμπί «Φίλτρα» με συρτάρι",why:"Δίπλα στην αναζήτηση υπάρχει ένα μόνο κουμπί «Φίλτρα» με τον αριθμό των ενεργών φίλτρων. Ανοίγει από δεξιά ένα συρτάρι με τις ίδιες κάρτες που διάλεξες, από τις οποίες ανοίγει μία κάθε φορά. Κάτω από την αναζήτηση φαίνονται τα ενεργά φίλτρα με ✕."},
  {key:"header",name:"3 — Φίλτρο μέσα στην επικεφαλίδα",why:"Δεν υπάρχει καμία έξτρα γραμμή. Πατάς την επικεφαλίδα μιας στήλης («ΚΑΤΑΣΤΑΣΗ ▾») και ανοίγουν οι επιλογές της από κάτω. Μια κόκκινη τελεία δείχνει ποια στήλη φιλτράρεται."}
];
const CLIENTS=["Studio Γιόγκα Ανάσα","Ανθοπωλείο Βιολέτα","Αρτοποιείο Μελίσσι","Γυμναστήριο Κίνηση Plus","Εκπαιδευτήριο Νέοι Ορίζοντες","Ελαιουργείο Χρυσή Σταγόνα","Κατασκευαστική Θεμέλιο","Καφεκοπτείο Ρόδι","Κοσμηματοπωλείο Αστέρι","Κτήμα Αμπελώνες Ολύμπου","Μουσική Σχολή Αρμονία","Ξενοδοχείο Γαλάζιο Ακρογιάλι","Οδοντιατρείο Χαμόγελο","Ταβέρνα Το Λιμανάκι"];
const CITIES=["Θεσσαλονίκη","Ρόδος","Θεσσαλονίκη","Λάρισα","Κατερίνη","Καλαμάτα","Βόλος","Θεσσαλονίκη","Αθήνα","Λιτόχωρο","Σέρρες","Χαλκιδική","Θεσσαλονίκη","Καβάλα"];
const PACK=["Social Plus (απέμεινε 1)","Podcast Β (ολοκληρώθηκε)","Social A (απέμειναν 2)"];
const pick=(a,i)=>a[i%a.length];
const initials=n=>n.split(" ").filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const clientRows=CLIENTS.map((name,i)=>{
  const status=i<2?"Υποψήφιος":i%5===4?"Ανενεργός":"Ενεργός";
  const monthly=status==="Ενεργός"&&i%3!==1, noshoot=monthly?i%4===0:true;
  return{name,city:CITIES[i],status,mgr:"ntontischris",opps:status==="Ανενεργός"?0:(i*7)%3+(status==="Υποψήφιος"?1:0),last:`${String((i*5)%28+1).padStart(2,"0")}/${i%2?"10":"11"}/2026`,
    pack:monthly?pick(PACK,i):"—",shoot:noshoot?"Χωρίς γύρισμα":"Έχει γύρισμα",monthly:monthly?"Με μηνιαίο":"Χωρίς μηνιαίο",ends:monthly?`${pick(["31/12","30/06","31/03"],i)}/2027`:"—"};
});
const sendRows=Array.from({length:40},(_,i)=>({client:CLIENTS[(i*5+(i%4))%14],status:i%11===0?"Απέτυχαν":i%4===0?"Προγραμματισμένα":"Στάλθηκαν",channel:i%3===0?"email":"Ειδοποίηση",
  main:pick(["Υπενθύμιση Γυρίσματος","Νέο Τιμολόγιο","Παράδοση βίντεο","Ευχές γιορτής","Λήξη Συμφωνίας"],i),date:`${String((i*3)%28+1).padStart(2,"0")}/10/2026`}));

const SCREENS={
  clients:{label:"Πελάτες",title:"Πελάτες",crumb:"Πελάτες › Πελάτες",cta:"Νέος Πελάτης / Ευκαιρία",search:"Αναζήτηση πελάτη…",rows:clientRows,text:r=>r.name+" "+r.city,
    groups:[{key:"status",label:"Κατάσταση",all:"όλες",options:["Υποψήφιος","Ενεργός","Ανενεργός"],col:1},
            {key:"shoot",label:"Γύρισμα αυτόν τον μήνα",all:"όλοι",options:["Χωρίς γύρισμα","Έχει γύρισμα"],col:5},
            {key:"monthly",label:"Μηνιαίο πακέτο",all:"όλοι",options:["Με μηνιαίο","Χωρίς μηνιαίο"],col:6}],
    cols:["Πελάτης","Κατάσταση","Υπεύθυνος","Ανοιχτές Ευκαιρίες","Τελευταία επαφή","Πακέτο · αυτός ο μήνας","Συμφωνία λήγει"],
    cells:r=>[`<div class="who"><div class="av">${initials(r.name)}</div><div><a href="#" onclick="return false">${esc(r.name)}</a><small>${esc(r.city)}</small></div></div>`,
      `<span class="st st-${r.status}">${r.status}</span>`,`<div class="mgr"><span>N</span>${r.mgr}</div>`,r.opps,r.last,esc(r.pack),r.ends],num:[3]},
  sends:{label:"Αποστολές",title:"Εταιρεία",crumb:"Εταιρεία › Ρυθμίσεις › Αποστολές",cta:"Νέος Αυτοματισμός",search:"Αναζήτηση αποστολής…",rows:sendRows,text:r=>r.main+" "+r.client,
    groups:[{key:"status",label:"Κατάσταση",all:"όλες",options:["Στάλθηκαν","Προγραμματισμένα","Απέτυχαν"],col:3},
            {key:"client",label:"Πελάτης",all:"όλοι",options:CLIENTS,many:true,col:1},
            {key:"channel",label:"Κανάλι",all:"όλα",options:["Ειδοποίηση","email"],col:2}],
    cols:["Αποστολή","Πελάτης","Κανάλι","Κατάσταση","Ημερομηνία"],
    cells:r=>[esc(r.main),esc(r.client),r.channel,r.status,r.date],num:[]}
};
const st={v:0,screen:"clients",sel:{},q:"",open:null,pq:"",drawer:false,acc:"status"};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const scr=()=>SCREENS[st.screen];
const sel=()=>st.sel[st.screen]||(st.sel[st.screen]={});
const match=(r,skip)=>{if(st.q&&!scr().text(r).toLowerCase().includes(st.q.toLowerCase()))return false;for(const g of scr().groups){if(g.key===skip)continue;if(sel()[g.key]&&r[g.key]!==sel()[g.key])return false}return true};
const visible=()=>scr().rows.filter(r=>match(r));
const count=(g,o)=>scr().rows.filter(r=>match(r,g.key)&&r[g.key]===o).length;
const active=()=>scr().groups.filter(g=>sel()[g.key]);
const cur=g=>sel()[g.key]||g.all;

function options(g){
  const q=st.pq.toLowerCase(), list=g.options.filter(o=>o.toLowerCase().includes(q));
  const row=(val,label,c)=>`<button class="opt" data-set="${g.key}" data-val="${esc(val)}" aria-pressed="${(sel()[g.key]||"")===val}"><span class="rd"></span><span class="o-l">${esc(label)}</span>${c==null?"":`<span class="o-c">${c}</span>`}</button>`;
  return`${g.many?`<input class="p-search" id="pq" placeholder="Ψάξε ${g.label.toLowerCase()}…" value="${esc(st.pq)}" autocomplete="off">`:""}<div class="list">${row("",g.all,null)}${list.map(o=>row(o,o,count(g,o))).join("")||`<div class="empty">Κανένα αποτέλεσμα</div>`}</div>`;
}
const tokens=()=>active().map(g=>`<span class="tok"><small>${g.label}:</small> ${esc(sel()[g.key])}<button data-set="${g.key}" data-val="" aria-label="Βγάλε το φίλτρο ${g.label}">✕</button></span>`).join("");
const clear=()=>active().length?`<button class="link" data-clear>Καθαρισμός φίλτρων</button>`:"";
const searchBox=()=>`<input class="search" id="q" placeholder="${scr().search}" value="${esc(st.q)}" autocomplete="off">`;

function table(headFor){
  const s=scr(), rows=visible(), shown=rows.slice(0,9);
  const head=s.cols.map((c,i)=>`<th>${headFor?headFor(i,c):c}</th>`).join("");
  const body=rows.length?shown.map(r=>`<tr>${s.cells(r).map((c,i)=>`<td class="${s.num.includes(i)?"num":""}">${c}</td>`).join("")}</tr>`).join(""):"";
  return`<div class="results"><div class="tbl"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${rows.length?"":`<div class="empty">Δεν υπάρχει τίποτα για αυτά τα φίλτρα.</div>`}${rows.length>9?`<div class="more">και άλλοι ${rows.length-9}…</div>`:""}</div>`;
}
function vRow(){
  const cards=scr().groups.map((g,i)=>{const open=st.open===g.key;return`<div class="fc"><button class="fc-btn" data-open="${g.key}" aria-expanded="${open}">${g.label}<span class="chip ${sel()[g.key]?"set":""}">${esc(cur(g))}</span><span class="chev">${open?"▴":"▾"}</span></button>${open?`<div class="pop ${i===scr().groups.length-1?"right":""}">${options(g)}</div>`:""}</div>`}).join("");
  return`<div style="display:flex;flex-direction:column;gap:12px"><div class="bar">${searchBox()}${cards}${clear()}</div>${table()}</div>`;
}
function vDrawer(){
  const n=active().length;
  const drawer=st.drawer?`<div class="scrim" data-close></div><aside class="drawer" aria-label="Φίλτρα"><h2>Φίλτρα <button class="link" data-close>Κλείσιμο</button></h2>${scr().groups.map(g=>{const open=st.acc===g.key;return`<section class="acc ${open?"open":""}"><button class="acc-h" data-acc="${g.key}" aria-expanded="${open}"><span>${g.label}</span><span class="chip ${sel()[g.key]?"set":""}">${esc(cur(g))}</span><span class="chev">${open?"▴":"▾"}</span></button>${open?`<div class="acc-b">${options(g)}</div>`:""}</section>`}).join("")}${clear()}<div class="crumb">${visible().length} αποτελέσματα</div></aside>`:"";
  return`<div style="display:flex;flex-direction:column;gap:12px"><div class="bar">${searchBox()}<button class="fbtn" data-drawer>Φίλτρα${n?`<span class="badge">${n}</span>`:""}</button></div>${n?`<div class="toks">${tokens()}${clear()}</div>`:""}${table()}</div>${drawer}`;
}
function vHeader(){
  const byCol=Object.fromEntries(scr().groups.map(g=>[g.col,g]));
  const head=(i,c)=>{const g=byCol[i];if(!g)return c;const open=st.open===g.key;
    return`<div class="fc" style="display:inline-block"><button class="th-btn ${sel()[g.key]?"set":""}" data-open="${g.key}" aria-expanded="${open}">${c}${sel()[g.key]?`<span class="dot" aria-label="φιλτράρεται"></span>`:""}<span class="chev">▾</span></button>${open?`<div class="pop ${i>3?"right":""}" style="text-transform:none;letter-spacing:0">${options(g)}</div>`:""}</div>`};
  return`<div style="display:flex;flex-direction:column;gap:12px"><div class="bar">${searchBox()}</div>${active().length?`<div class="toks">${tokens()}${clear()}</div>`:""}${table(head)}</div>`;
}
function render(){
  const ae=document.activeElement, focusId=ae?.id, caret=ae?.selectionStart;
  const s=scr(), V=VARIANTS[st.v];
  document.getElementById("screens").innerHTML=Object.entries(SCREENS).map(([k,x])=>`<button data-screen="${k}" aria-pressed="${k===st.screen}">${x.label}</button>`).join("");
  document.getElementById("crumb").textContent=s.crumb;
  document.getElementById("title").innerHTML=`${s.title}<i>.</i>`;
  document.getElementById("cta").textContent=s.cta;
  document.getElementById("why").textContent=V.why;
  document.getElementById("vlabel").textContent=V.name;
  document.getElementById("ui").innerHTML=[vRow,vDrawer,vHeader][st.v]();
  document.getElementById("state").innerHTML=`Παραλλαγή <b>${st.v+1}</b> · Οθόνη <b>${s.label}</b>${st.q?` · Αναζήτηση = <b>${esc(st.q)}</b>`:""}${active().map(g=>` · ${g.label} = <b>${esc(sel()[g.key])}</b>`).join("")} · <b>${visible().length}</b> από ${s.rows.length}`;
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();if(caret!=null&&el.setSelectionRange)el.setSelectionRange(caret,caret)}}
  try{history.replaceState(null,"","#"+V.key)}catch(e){}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-close]");
  if(!t){if(st.open&&!e.target.closest(".pop")){st.open=null;st.pq="";render()}return}
  const d=t.dataset;
  if(d.screen){st.screen=d.screen;st.open=null;st.pq="";st.q="";st.acc="status"}
  else if(d.open){st.open=st.open===d.open?null:d.open;st.pq="";if(st.open)setTimeout(()=>document.getElementById("pq")?.focus())}
  else if(d.acc){st.acc=st.acc===d.acc?null:d.acc;st.pq=""}
  else if(d.set!=null&&d.val!=null){sel()[d.set]=d.val||null;st.open=null;st.pq=""}
  else if(d.clear!=null)st.sel[st.screen]={};
  else if(d.drawer!=null)st.drawer=true;
  else if(d.close!=null)st.drawer=false;
  else if(t.id==="prev")go(-1);
  else if(t.id==="next")go(1);
  else return;
  render();
});
document.addEventListener("input",e=>{if(e.target.id==="q"){st.q=e.target.value;render()}if(e.target.id==="pq"){st.pq=e.target.value;render()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){st.open=null;st.pq="";st.drawer=false;render();return}
  if(e.target.closest("input,textarea,[contenteditable]"))return;
  if(e.key==="ArrowLeft"){go(-1);render()}
  if(e.key==="ArrowRight"){go(1);render()}
});
function go(d){st.v=(st.v+d+VARIANTS.length)%VARIANTS.length;st.open=null;st.pq="";st.drawer=false}
const hi=VARIANTS.findIndex(v=>v.key===location.hash.slice(1));if(hi>=0)st.v=hi;
render();
</script>
